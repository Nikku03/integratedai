[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integratedai"
version = "0.1.0"
description = "Catalyst-driven, point-in-time-safe equity research and trading stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "pyarrow>=14"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
iai = "iai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks legitimately import mid-cell and group imports by what the cell
# does rather than by PEP 8 -- linting them as modules fights the format.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
